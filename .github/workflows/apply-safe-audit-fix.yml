name: Apply Safe Audit Fix

on:
  pull_request:

permissions:
  contents: read

jobs:
  apply-safe-audit-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: docs/app-development-a-z

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Apply root non-force lockfile fixes
        run: |
          npm ci
          npm audit fix --package-lock-only || true
          npm ci
          npm run verify:expo
          npm run lint
          npm run verify:quality

      - name: Apply Functions non-force lockfile fixes
        working-directory: functions
        run: |
          npm ci
          npm audit fix --package-lock-only || true
          npm ci
          npm run verify

      - name: Reject direct dependency manifest changes
        run: git diff --exit-code -- package.json functions/package.json

      - name: Commit lockfile-only security updates
        run: |
          if git diff --quiet -- package-lock.json functions/package-lock.json; then
            echo "No safe lockfile-only updates were available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json functions/package-lock.json
          git commit -m "deps: apply non-force audit lockfile fixes"
          git push origin HEAD:docs/app-development-a-z
