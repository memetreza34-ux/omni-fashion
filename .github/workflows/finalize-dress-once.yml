name: Finalize Dress Domain Once

on:
  push:
    branches:
      - docs/app-development-a-z
    paths:
      - .github/workflows/finalize-dress-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v6
        with:
          ref: docs/app-development-a-z

      - name: Apply Dress consistency patch
        shell: python
        run: |
          from pathlib import Path

          modal = Path('src/components/ItemDetailsModal.tsx')
          text = modal.read_text()
          old = "  'Top',\n  'Bottom',\n  'Shoes',"
          new = "  'Top',\n  'Bottom',\n  'Dress',\n  'Shoes',"
          if old not in text:
              raise SystemExit('ItemDetailsModal category anchor not found')
          modal.write_text(text.replace(old, new, 1))

          rules = Path('firestore.rules')
          text = rules.read_text()
          old = "'Top', 'Bottom', 'Shoes', 'Accessory', 'Outerwear', 'Other'"
          new = "'Top', 'Bottom', 'Dress', 'Shoes', 'Accessory', 'Outerwear', 'Other'"
          if old not in text:
              raise SystemExit('Firestore wardrobe category anchor not found')
          rules.write_text(text.replace(old, new, 1))

          security_test = Path('tests/security/firestore.rules.integration.mjs')
          text = security_test.read_text()
          anchor = "    await updateDoc(wardrobeRef, {\n      name: 'Schwarze Lederjacke',\n      brand: 'Vintage',\n      material: 'Leder',\n      updatedAt: Timestamp.now(),\n    });\n"
          addition = anchor + "\n    // Dress is a first-class wardrobe category and remains user-editable.\n    await updateDoc(wardrobeRef, {\n      category: 'Dress',\n      subcategory: 'Midikleid',\n      updatedAt: Timestamp.now(),\n    });\n    await updateDoc(wardrobeRef, {\n      category: 'Outerwear',\n      subcategory: null,\n      updatedAt: Timestamp.now(),\n    });\n"
          if anchor not in text:
              raise SystemExit('Firestore test update anchor not found')
          security_test.write_text(text.replace(anchor, addition, 1))

          dead = Path('src/components/StyleDeciderModal.tsx')
          if dead.exists():
              dead.unlink()

          workflow = Path('.github/workflows/finalize-dress-once.yml')
          workflow.unlink()

      - name: Commit patch and self-cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize Dress support and remove fake style decider"
          git push origin HEAD:docs/app-development-a-z
