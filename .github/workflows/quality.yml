name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  type-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and zero-any checks
        run: npm run verify:quality
