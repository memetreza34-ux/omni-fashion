name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  type-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript and zero-any checks
        run: npm run verify:quality

  firebase-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Firestore and Storage Security Rules integration tests
        run: >-
          npx --yes firebase-tools emulators:exec
          --project demo-omni-fashion-rules
          --only auth,firestore,storage
          "node tests/security/firestore.rules.integration.mjs && node tests/security/storage.rules.integration.mjs"
