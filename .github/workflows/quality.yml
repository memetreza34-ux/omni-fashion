name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  type-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo SDK dependency compatibility
        run: npm run verify:expo

      - name: Expo ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: TypeScript, foundation and zero-any checks
        run: npm run verify:quality

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Classify app runtime dependencies
        run: npm run audit:runtime

      - name: Classify Functions runtime dependencies
        run: npm run audit:functions-runtime

  expo-bundle-smoke:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_APP_ENV: ci
      EXPO_PUBLIC_FIREBASE_API_KEY: ci-api-key
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: omni-fashion-ci
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: omni-fashion-ci.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '100000000000'
      EXPO_PUBLIC_FIREBASE_APP_ID: 1:100000000000:web:0000000000000000000000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export Expo Router production web bundle
        run: npx expo export --platform web --output-dir dist-ci

  functions-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Typecheck and build Functions
        working-directory: functions
        run: npm run verify

  firebase-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Firestore and Storage Security Rules integration tests
        run: >-
          npx --yes firebase-tools emulators:exec
          --project demo-omni-fashion-rules
          --only auth,firestore,storage
          "node tests/security/firestore.rules.integration.mjs && node tests/security/trust-safety.rules.integration.mjs && node tests/security/push.rules.integration.mjs && node tests/security/feature-flags.rules.integration.mjs && node tests/security/rate-limits.rules.integration.mjs && node tests/security/storage.rules.integration.mjs"
