name: Format Wardrobe Upload Once

on:
  pull_request:

concurrency:
  group: format-wardrobe-upload-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: docs/app-development-a-z

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format wardrobe upload service
        run: npx prettier src/features/wardrobe/services/wardrobe-storage-service.ts --write

      - name: Verify formatted service
        run: npx prettier src/features/wardrobe/services/wardrobe-storage-service.ts --check

      - name: Commit formatting only
        run: |
          if git diff --quiet -- src/features/wardrobe/services/wardrobe-storage-service.ts; then
            echo "Wardrobe upload service is already formatted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/wardrobe/services/wardrobe-storage-service.ts
            git commit -m "style: format wardrobe upload service"
            git push origin HEAD:docs/app-development-a-z
          fi

      - name: Verify root quality
        run: npm run lint && npm run format:check && npm run verify:quality
