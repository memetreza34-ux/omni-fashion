name: Harden OmniSwap Rules Once

on:
  push:
    branches:
      - docs/app-development-a-z
    paths:
      - .github/workflows/harden-swap-rules-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/app-development-a-z
      - name: Patch trusted marketplace security boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          rules_path = Path('firestore.rules')
          rules = rules_path.read_text()
          old_delete = "      allow delete: if ownsExistingDocument();\n    }\n\n    match /outfits/{outfitId}"
          new_delete = "      allow delete: if ownsExistingDocument()\n        && resource.data.isListedForSwap == false\n        && !exists(/databases/$(database)/documents/swapLocks/$(itemId));\n    }\n\n    match /outfits/{outfitId}"
          if old_delete not in rules:
              raise SystemExit('wardrobe delete block not found')
          rules = rules.replace(old_delete, new_delete, 1)

          old_listing = """    match /swapListings/{listingId} {
      allow read: if resource.data.status == 'active'
        || (signedIn() && resource.data.ownerId == request.auth.uid);
      allow create: if ownsIncomingDocument()
        && request.resource.data.status in ['draft', 'active'];
      allow update: if ownsExistingDocument()
        && ownerIdIsUnchanged()
        && request.resource.data.status in ['draft', 'active', 'paused', 'removed'];
      allow delete: if ownsExistingDocument()
        && resource.data.status in ['draft', 'paused', 'removed'];
    }
"""
          new_listing = """    match /swapListings/{listingId} {
      allow read: if resource.data.status == 'active'
        || (signedIn() && resource.data.ownerId == request.auth.uid);

      // Listing creation, lifecycle changes and deletion must keep the public
      // projection, private WardrobeItem linkage and public Storage media in
      // sync. Only trusted backend commands may mutate them.
      allow create, update, delete: if false;
    }
"""
          if old_listing not in rules:
              raise SystemExit('swap listing block not found')
          rules_path.write_text(rules.replace(old_listing, new_listing, 1))

          test_path = Path('tests/security/firestore.rules.integration.mjs')
          test = test_path.read_text()
          start = test.index("    const listingRef = doc(owner.db, 'swapListings', 'listing-1');")
          end = test.index("    await expectPermissionDenied(\n      setDoc(doc(owner.db, 'swapOffers', 'offer-1')", start)
          replacement = """    await expectPermissionDenied(
      setDoc(doc(owner.db, 'swapListings', 'listing-1'), {
        ownerId,
        wardrobeItemId: itemId,
        title: 'Schwarze Lederjacke',
        status: 'active',
        createdAt: Timestamp.now(),
        updatedAt: Timestamp.now(),
      }),
      'client creates swap listing directly',
    );

"""
          test_path.write_text(test[:start] + replacement + test[end:])
          Path('.github/workflows/harden-swap-rules-once.yml').unlink()
          PY
      - name: Commit hardened rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules tests/security/firestore.rules.integration.mjs .github/workflows/harden-swap-rules-once.yml
          git commit -m "security: make OmniSwap mutations trusted-backend-only"
          git push origin HEAD:docs/app-development-a-z
