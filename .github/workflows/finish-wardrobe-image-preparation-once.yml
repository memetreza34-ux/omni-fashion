name: Finish Wardrobe Image Preparation Once

on:
  pull_request:

concurrency:
  group: finish-wardrobe-image-preparation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  finish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: docs/app-development-a-z

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wire picker dimensions into wardrobe preparation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/index.tsx')
          text = path.read_text()

          replacements = [
              (
                  "    case 'too_large':\n",
                  "    case 'preparation_failed':\n"
                  "      return {\n"
                  "        title: 'Bild konnte nicht vorbereitet werden',\n"
                  "        message:\n"
                  "          'Das Bild konnte nicht sicher verkleinert oder komprimiert werden. Bitte wähle es erneut über Kamera oder Galerie aus.',\n"
                  "      };\n"
                  "    case 'too_large':\n",
              ),
              (
                  "      await processAndSaveImage(result.assets[0].uri, 'camera');",
                  "      await processAndSaveImage(result.assets[0], 'camera');",
              ),
              (
                  "      await processAndSaveImage(result.assets[0].uri, 'library');",
                  "      await processAndSaveImage(result.assets[0], 'library');",
              ),
              (
                  "  const processAndSaveImage = async (\n"
                  "    uri: string,\n"
                  "    source: Extract<WardrobeSource, 'camera' | 'library'>,\n"
                  "  ) => {",
                  "  const processAndSaveImage = async (\n"
                  "    asset: ImagePicker.ImagePickerAsset,\n"
                  "    source: Extract<WardrobeSource, 'camera' | 'library'>,\n"
                  "  ) => {",
              ),
              (
                  "      const newItem = await addItem({\n"
                  "        localImageUri: uri,\n"
                  "        source,\n"
                  "      });",
                  "      const newItem = await addItem({\n"
                  "        localImageUri: asset.uri,\n"
                  "        imageWidth: asset.width,\n"
                  "        imageHeight: asset.height,\n"
                  "        source,\n"
                  "      });",
              ),
              (
                  "                onPress: () => void processAndSaveImage(uri, source),",
                  "                onPress: () => void processAndSaveImage(asset, source),",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Format Wardrobe image pipeline
        run: |
          npx prettier \
            src/app/index.tsx \
            src/context/WardrobeContext.tsx \
            src/features/wardrobe/types.ts \
            src/features/wardrobe/services/wardrobe-image-preparation-service.ts \
            src/features/wardrobe/services/wardrobe-storage-service.ts \
            --write

      - name: Verify Expo and root quality
        run: |
          npm run verify:expo
          npm run lint
          npm run format:check
          npm run verify:quality

      - name: Commit Wardrobe image pipeline
        run: |
          if git diff --quiet -- \
            src/app/index.tsx \
            src/context/WardrobeContext.tsx \
            src/features/wardrobe/types.ts \
            src/features/wardrobe/services/wardrobe-image-preparation-service.ts \
            src/features/wardrobe/services/wardrobe-storage-service.ts; then
            echo "Wardrobe image preparation pipeline is already complete."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/index.tsx \
            src/context/WardrobeContext.tsx \
            src/features/wardrobe/types.ts \
            src/features/wardrobe/services/wardrobe-image-preparation-service.ts \
            src/features/wardrobe/services/wardrobe-storage-service.ts
          git commit -m "feat: finish wardrobe image preparation pipeline"
          git push origin HEAD:docs/app-development-a-z
