name: Install Image Manipulator Once

on:
  pull_request:

concurrency:
  group: install-image-manipulator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: docs/app-development-a-z

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install SDK 57 image manipulator
        run: npx expo install expo-image-manipulator

      - name: Verify Expo dependency compatibility
        run: npm run verify:expo

      - name: Verify root quality
        run: npm run lint && npm run format:check && npm run verify:quality

      - name: Commit package and lockfile
        run: |
          git diff --exit-code -- . ':!package.json' ':!package-lock.json'
          if git diff --quiet -- package.json package-lock.json; then
            echo "expo-image-manipulator is already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "deps: add SDK57 image manipulator"
          git push origin HEAD:docs/app-development-a-z
