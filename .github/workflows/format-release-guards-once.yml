name: Format Release Guards Once

on:
  pull_request:

concurrency:
  group: format-release-guards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: docs/app-development-a-z

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format release guards
        run: >-
          npx prettier
          scripts/validate-release-config.js
          scripts/verify-production-foundation.js
          --write

      - name: Verify formatted guards
        run: >-
          npx prettier
          scripts/validate-release-config.js
          scripts/verify-production-foundation.js
          --check

      - name: Verify lint and production foundation
        run: npm run lint && npm run verify:quality

      - name: Commit formatting only
        run: |
          if git diff --quiet -- scripts/validate-release-config.js scripts/verify-production-foundation.js; then
            echo "Release guard files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-release-config.js scripts/verify-production-foundation.js
          git commit -m "style: format release guard scripts"
          git push origin HEAD:docs/app-development-a-z
