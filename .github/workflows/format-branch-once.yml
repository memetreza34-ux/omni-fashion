name: Format Branch Once

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: docs/app-development-a-z

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format repository
        run: npm run format

      - name: Verify Expo SDK compatibility
        run: npm run verify:expo

      - name: Verify lint, formatting and root quality
        run: npm run lint && npm run format:check && npm run verify:quality

      - name: Verify Functions after formatting
        working-directory: functions
        run: npm ci && npm run verify

      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "Repository is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply repository prettier formatting"
          git push origin HEAD:docs/app-development-a-z
